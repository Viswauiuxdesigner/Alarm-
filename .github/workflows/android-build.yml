name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.2.2
        run: |
          mkdir -p $HOME/gradle
          curl -sSL https://services.gradle.org/distributions/gradle-8.2.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.2.2/bin" >> $GITHUB_PATH

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          gradle --version
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
