name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Web Assets for Android WebView
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/ 2>/dev/null || true

      - name: Generate Gradle Wrapper & Build Debug APK
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Output
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
